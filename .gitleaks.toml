# .gitleaks.toml
#
# Tuning for a Fabric CI/CD repo. Two things make this repo different from a
# generic codebase, and they pull in opposite directions:
#
#   1. Fabric item definitions are FULL of GUIDs — workspace ids, item ids,
#      logicalIds in .platform, OneLake paths in .tmdl. None of them are secrets.
#      Workspace ids already live in repository variables, in the clear.
#
#   2. The warehouse path builds real ODBC connection strings containing a
#      service principal secret. Today those are assembled from variables at
#      runtime; the failure mode is someone pasting a working one in to debug.
#
# So: keep every default rule, add a rule for (2), and allowlist only what can
# be pointed at in this repo — never a whole path.

title = "Fabric CI/CD"

[extend]
useDefault = true

# ----------------------------------------------------------------------
# Rules
# ----------------------------------------------------------------------

# Catches Password=<literal>. The leading character class excludes $ and {,
# so the templated forms this repo actually uses do not match:
#   Password=$AZURE_CLIENT_SECRET          (deploy-warehouse.yml)
#   PWD={{ ... }}                          (any expression syntax)
# Note gitleaks uses Go RE2 — no lookahead, hence the character class.
[[rules]]
id = "fabric-connection-string-password"
description = "Literal password in a warehouse connection string"
regex = '''(?i)(?:password|pwd)\s*=\s*([^$;"'\s{][^;"'\s]{7,})'''
keywords = ["password", "pwd"]
tags = ["fabric", "warehouse", "connection-string"]

# A JWT pasted into a notebook or script while debugging the Fabric REST API.
# These are short-lived, which is exactly why people paste them and forget.
[[rules]]
id = "fabric-api-bearer-token"
description = "Fabric or Power BI API bearer token"
regex = '''(?i)bearer\s+(eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,})'''
keywords = ["bearer"]
tags = ["fabric", "token"]

# ----------------------------------------------------------------------
# Allowlist
# ----------------------------------------------------------------------
# Add entries here on EVIDENCE — a run that flagged something provably safe.
# Allowlisting preemptively is how a scanner quietly stops finding things.
#
# Deliberately absent: any path rule for fabric/. A .platform or .tmdl file is
# a plausible place for someone to paste a token, and excluding the folder
# because it is noisy would be excluding it exactly where it is needed.
[allowlist]
description = "Values this repo produces that are secret-shaped but public"
regexTarget = "match"
regexes = [
  # GitHub expressions naming a secret. The value is never in the repo — only
  # the name is, and the name is not sensitive.
  '''\$\{\{\s*secrets\.[A-Za-z_][A-Za-z0-9_]*\s*\}\}''',

  # fabric-cicd dynamic variables in parameter.yml. These are placeholders
  # resolved at publish time against the target workspace.
  '''\$items\.[A-Za-z]+\.[^.\s]+\.\$[a-z]+''',
  '''\$workspace\.\$id''',
]

paths = [
  # Build output. Gitignored, so this only matters if someone force-adds it.
  '''dacpac-out/''',
]
