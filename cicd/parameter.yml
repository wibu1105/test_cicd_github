find_replace:
  - find_value: 'Sql\.Database\(("[a-z0-9\-]+\.datawarehouse\.fabric\.microsoft\.com",\s*"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"\)'
    is_regex: "true"
    replace_value:
      test: '"$items.Warehouse.insurance_WH.sqlendpoint", "$items.Warehouse.insurance_WH.id"'
    item_type: "SemanticModel"

  - find_value: "YOUR_DEV_WORKSPACE_GUID"
    replace_value:
      test: "$workspace.id"
    item_type: "Notebook"

  - find_value: "YOUR_DEV_LAKEHOUSE_GUID"
    replace_value:
      test: "$items.Lakehouse.insurance_LH.id"
    item_type: "Notebook"

  - find_value: "YOUR_DEV_SQL_ENDPOINT_GUID"
    replace_value:
      test: "$items.Lakehouse.insurance_LH.sqlendpointid"  # ⚠️ test kỹ, attribute này chưa được xác nhận ổn định
    item_type: "Notebook"

  - find_value: "YOUR_DEV_NOTEBOOK_GUID"
    replace_value:
      test: "$items.Notebook.load_insurance.id"
    item_type: "DataPipeline"

  - find_value: "YOUR_DEV_WAREHOUSE_GUID"
    replace_value:
      test: "$items.Warehouse.insurance_WH.id"
    item_type: "DataPipeline"

  - find_value: "YOUR_DEV_LAKEHOUSE_GUID"
    replace_value:
      test: "$items.Lakehouse.insurance_LH.id"
    item_type: "DataPipeline"
