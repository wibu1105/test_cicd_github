find_replace:

  # Workspace ID
  - find_value: "20d6e797-9f3e-4e0a-a291-0789bdb1b623"
    replace_value:
      test: "$workspace.$id"

  # Notebook ID
  - find_value: "e46c6022-a4b4-4510-873e-e14bf66221d3"
    replace_value:
      test: "$items.Notebook.nb_transform.$id"
    item_type: "DataPipeline"

  # Lakehouse ID
  - find_value: "<DEV_LAKEHOUSE_GUID>"
    replace_value:
      test: "$items.Lakehouse.<LakehouseName>.$id"

  # Warehouse ID
  - find_value: "5e59288a-8c37-41e0-985f-9791bffd60c6"
    replace_value:
      test: "$items.Warehouse.insurance_WH.$id"

  # Semantic Model - Warehouse connection
  - find_value: 'Sql\.Database\(("[a-z0-9\-]+\.datawarehouse\.fabric\.microsoft\.com",\s*"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"\)'
    is_regex: "true"
    replace_value:
      test: '"$items.Warehouse.insurance_WH.$sqlendpoint", "$items.Warehouse.insurance_WH.$id"'
    item_type: "SemanticModel"
