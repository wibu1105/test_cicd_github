key_value_replace:

  # ------------------------------------------------------------------
  # DataPipeline pl_silver -> notebook activity "Notebook1"
  #
  # The activity name below MUST match the "name" field of the notebook
  # activity in pipeline-content.json. Yours is "Notebook1".
  # ------------------------------------------------------------------
  - find_key: $.properties.activities[?(@.name=="Notebook1")].typeProperties.notebookId
    replace_value:
      test: "$items.Notebook.nb_transform.id"
    item_type: "DataPipeline"

  - find_key: $.properties.activities[?(@.name=="Notebook1")].typeProperties.workspaceId
    replace_value:
      test: "$workspace.id"
    item_type: "DataPipeline"

find_replace:

  # ------------------------------------------------------------------
  # Semantic model sales_semantic_model -> warehouse connection.
  # Captures hostname + database GUID as one group; replaces with both
  # dynamic tokens together. Resolved against insurance_WH in the target
  # workspace at deploy time.
  # ------------------------------------------------------------------
  - find_value: 'Sql\.Database\(("[a-z0-9\-]+\.datawarehouse\.fabric\.microsoft\.com",\s*"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"\)'
    is_regex: "true"
    replace_value:
      test: '"$items.Warehouse.insurance_WH.sqlendpoint", "$items.Warehouse.insurance_WH.id"'
    item_type: "SemanticModel"

  # ------------------------------------------------------------------
  # nb_lakehouse_schema -> attached lakehouse.
  #
  # A notebook's METADATA header stores the lakehouse it is attached to as the
  # dev workspace's item id plus that workspace's id. Both have to be rewritten,
  # or the notebook deploys cleanly and then writes its schema into the dev
  # lakehouse. The lakehouse id appears twice (default_lakehouse and
  # known_lakehouses) — a literal find_replace rewrites every occurrence.
  #
  # Note this is the item id, NOT the logicalId in test_LH.Lakehouse/.platform;
  # those are two different GUIDs for the same item.
  # ------------------------------------------------------------------
  - find_value: "b55ebcb9-1444-450f-92eb-0dd5f28bbe6d"
    replace_value:
      test: "$items.Lakehouse.test_LH.id"
    item_type: "Notebook"

  - find_value: "20d6e797-9f3e-4e0a-a291-0789bdb1b623"
    replace_value:
      test: "$workspace.id"
    item_type: "Notebook"
