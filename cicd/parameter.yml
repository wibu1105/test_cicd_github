# cicd/parameter.yml
#
# Script-free parameterisation: every environment-specific id, workspace id and
# SQL endpoint is resolved by fabric-cicd at deploy time from dynamic variables.
# No GUID is written down here, and cicd/resolve_ids.py is no longer needed.
#
# REQUIREMENT: the workflow that publishes these items must include Warehouse and
# Lakehouse in --items-in-scope. A $items.<Type>.<name>.$<attr> variable only
# resolves when that item type is in scope for the run. Warehouse and Lakehouse
# still get their schema from deploy-warehouse.yml / deploy-lakehouse.yml -- being
# in scope here only publishes the item shell.
#
# Item type and item name are CASE SENSITIVE and must match the repo folder names.

key_value_replace:

  # ------------------------------------------------------------------
  # DataPipeline pl_silver -> notebook activity "Notebook1"
  #
  # The activity name below MUST match the "name" field of the notebook
  # activity in pipeline-content.json. Yours is "Notebook1".
  # ------------------------------------------------------------------
  - find_key: $.properties.activities[?(@.name=="Notebook1")].typeProperties.notebookId
    replace_value:
      test: "$items.Notebook.nb_transform.$id"
    item_type: "DataPipeline"

  - find_key: $.properties.activities[?(@.name=="Notebook1")].typeProperties.workspaceId
    replace_value:
      test: "$workspace.$id"
    item_type: "DataPipeline"

find_replace:

  # ==================================================================
  # 1. Semantic model -> warehouse connection
  #
  # Two single-capture-group rules instead of one combined rule: a regex
  # find_value may only use capture group 1 as the replacement target, so
  # hostname and database GUID each need their own rule. Rule 2 still matches
  # after rule 1 runs, because the test endpoint has the same hostname shape.
  # ==================================================================

  # 1a. hostname -> SQL endpoint of insurance_WH in the target workspace
  - find_value: 'Sql\.Database\("([a-zA-Z0-9\-]+\.datawarehouse\.fabric\.microsoft\.com)"'
    is_regex: "true"
    replace_value:
      test: "$items.Warehouse.insurance_WH.$sqlendpoint"
    item_type: "SemanticModel"

  # 1b. database GUID -> item id of insurance_WH in the target workspace
  - find_value: 'Sql\.Database\("[a-zA-Z0-9\-]+\.datawarehouse\.fabric\.microsoft\.com",\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"'
    is_regex: "true"
    replace_value:
      test: "$items.Warehouse.insurance_WH.$id"
    item_type: "SemanticModel"

  # ==================================================================
  # 2. Notebook attached store -> lakehouse / warehouse in the target workspace
  #
  # The GUID is matched through its surrounding METADATA context, never on GUID
  # shape alone -- a bare GUID pattern would happily rewrite any other GUID in
  # the file. Add one pair of rules per attached store.
  # ==================================================================

  # 2a. nb_lakehouse_schema (and any notebook attached to test_LH)
  - find_value: '\#\s*META\s+"default_lakehouse":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"'
    is_regex: "true"
    replace_value:
      test: "$items.Lakehouse.test_LH.$id"
    item_type: "Notebook"

  # 2b. the workspace the attached lakehouse lives in
  #     Fabric rejects the notebook outright if this field is empty or stale.
  - find_value: '\#\s*META\s+"default_lakehouse_workspace_id":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"'
    is_regex: "true"
    replace_value:
      test: "$workspace.$id"
    item_type: "Notebook"

  # 2c. nb_transform attached to the warehouse
  - find_value: '\#\s*META\s+"default_warehouse":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"'
    is_regex: "true"
    replace_value:
      test: "$items.Warehouse.insurance_WH.$id"
    item_type: "Notebook"

  - find_value: '\#\s*META\s+"default_warehouse_workspace_id":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"'
    is_regex: "true"
    replace_value:
      test: "$workspace.$id"
    item_type: "Notebook"
