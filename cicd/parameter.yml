key_value_replace:

  # ------------------------------------------------------------------
  # DataPipeline pl_silver -> notebook activity "Notebook1"
  #
  # The activity name below MUST match the "name" field of the notebook
  # activity in pipeline-content.json. Yours is "Notebook1".
  # ------------------------------------------------------------------
  - find_key: $.properties.activities[?(@.name=="Notebook1")].typeProperties.notebookId
    replace_value:
      test: "$items.Notebook.nb_transform.id"
    item_type: "DataPipeline"

  - find_key: $.properties.activities[?(@.name=="Notebook1")].typeProperties.workspaceId
    replace_value:
      test: "$workspace.id"
    item_type: "DataPipeline"

find_replace:

  # ------------------------------------------------------------------
  # Semantic model sales_semantic_model -> warehouse connection.
  # Captures hostname + database GUID as one group; replaces with both
  # dynamic tokens together. Resolved against insurance_WH in the target
  # workspace at deploy time.
  # ------------------------------------------------------------------
  - find_value: 'Sql\.Database\(("[a-z0-9\-]+\.datawarehouse\.fabric\.microsoft\.com",\s*"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"\)'
    is_regex: "true"
    replace_value:
      test: '"$items.Warehouse.insurance_WH.sqlendpoint", "$items.Warehouse.insurance_WH.id"'
    item_type: "SemanticModel"

  # ------------------------------------------------------------------
  # Notebooks that attach a lakehouse or warehouse are NOT listed here.
  #
  # Their headers carry the source workspace's item id and workspace id, which
  # change whenever a store is recreated. Writing those GUIDs down here means
  # updating this file every time that happens, and a stale entry fails silently
  # — the rule just stops matching and the notebook deploys still pointing at the
  # workspace it came from.
  #
  # cicd/resolve_ids.py generates those rules at deploy time instead: it lists
  # the source workspace over the Fabric REST API and emits, for every lakehouse
  # and warehouse it finds, find_value: <live id> -> $items.<Type>.<name>.id.
  # Recreate a lakehouse as often as you like; as long as the name holds, the
  # next run reads the new id straight from Fabric.
  # ------------------------------------------------------------------
