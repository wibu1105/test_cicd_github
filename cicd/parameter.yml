# cicd/parameter.yml
#
# Source of truth for parameterisation. Kept here (not in fabric/) so that
# fabric/ contains nothing but Fabric-generated item folders. The workflow
# copies this file to fabric/parameter.yml on the GitHub runner just before
# Phase 1 — fabric-cicd only reads parameter.yml from the root of
# repository_directory.
#
# Environment keys ("test") must match the value passed to --target-env.
# Item type and item name are CASE SENSITIVE and must match the folder in
# the repo exactly.

find_replace:

  # ------------------------------------------------------------------
  # Repoint the semantic model's warehouse connection — fully automatic,
  # no manual value to paste in.
  #
  # A semantic model over a Fabric warehouse stores its connection as:
  #     Sql.Database("<hostname>.datawarehouse.fabric.microsoft.com", "<guid>")
  #
  # The pattern below captures BOTH arguments — hostname and GUID — as a
  # single group, and replace_value supplies BOTH dynamic tokens together.
  # fabric-cicd resolves each token against the target workspace's actual
  # insurance_WH at deploy time, so the DEV values never need to be known
  # or copied by hand — this works unchanged even if the dev warehouse is
  # deleted and recreated.
  # ------------------------------------------------------------------
  - find_value: 'Sql\.Database\(("[a-z0-9\-]+\.datawarehouse\.fabric\.microsoft\.com",\s*"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"\)'
    is_regex: "true"
    replace_value:
      test: '"$items.Warehouse.insurance_WH.sqlendpoint", "$items.Warehouse.insurance_WH.id"'
    item_type: "SemanticModel"

  # ------------------------------------------------------------------
  # OPTIONAL — only needed if you have a Report item that connects to
  # sales_semantic_model via "byConnection" (live/XMLA connection).
  #
  # Reports using "byPath" (same-workspace, the common case when you
  # publish straight from Power BI Desktop) are re-pointed automatically
  # by fabric-cicd — nothing to add for those.
  #
  # byConnection always points at the DEV semantic model unless
  # parameterized here. Uncomment and fill in your report's item name
  # if this applies to you.
  #
  # - find_value: 'semanticmodelid=([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})'
  #   is_regex: "true"
  #   replace_value:
  #     test: "$items.SemanticModel.sales_semantic_model.id"
  #   item_type: "Report"
  #   item_name: "your_report_name"

  # correctly for your model's exact TMDL formatting (e.g. line breaks
  # inside Sql.Database(...), or a different M expression shape).
  #
  # This is the two-entry version: hostname via regex (dynamic, no
  # manual value needed), GUID as a literal (requires pasting the DEV
  # warehouse GUID once). Uncomment and delete the entry above if the
  # combined version fails validation or produces an unresolved token
  # in the deployed .tmdl.
  #
  # To find the GUID to paste in:
  #   grep -ri "datawarehouse.fabric.microsoft.com" \
  #     fabric/sales_semantic_model.SemanticModel/
  #
  # - find_value: '([a-z0-9\-]+\.datawarehouse\.fabric\.microsoft\.com)'
  #   is_regex: "true"
  #   replace_value:
  #     test: "$items.Warehouse.insurance_WH.sqlendpoint"
  #   item_type: "SemanticModel"
  #
  # - find_value: "<DEV_WAREHOUSE_GUID>"
  #   replace_value:
  #     test: "$items.Warehouse.insurance_WH.id"
  #   item_type: "SemanticModel"
