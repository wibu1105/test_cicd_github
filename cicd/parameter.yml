key_value_replace:

  # ------------------------------------------------------------------
  # DataPipeline pl_silver -> notebook activity "Notebook1"
  #
  # The activity name below MUST match the "name" field of the notebook
  # activity in pipeline-content.json. Yours is "Notebook1".
  # ------------------------------------------------------------------
  - find_key: $.properties.activities[?(@.name=="Notebook1")].typeProperties.notebookId
    replace_value:
      test: "$items.Notebook.nb_transform.id"
    item_type: "DataPipeline"

  - find_key: $.properties.activities[?(@.name=="Notebook1")].typeProperties.workspaceId
    replace_value:
      test: "$workspace.id"
    item_type: "DataPipeline"

find_replace:

  # ==================================================================
  # Dev GUIDs baked into item definitions.
  #
  # These three ids belong to the dev workspace. They are written into
  # item definitions by Fabric itself when you attach a store in the UI,
  # and they do NOT change on their own — so they are pinned here rather
  # than resolved from the Fabric API at deploy time.
  #
  # None of these rules sets item_type. That is deliberate: the same dev
  # id shows up in more than one kind of item, and a filter is exactly
  # what made the semantic model deploy still pointing at dev.
  #   - workspace id  -> nb_lakehouse_schema header + semantic model URL
  #   - test_LH id    -> nb_lakehouse_schema header
  #   - insurance_WH  -> semantic model DirectLake URL
  # A full GUID only ever matches a real reference to that item, so
  # letting these apply everywhere is both safer and less to maintain.
  #
  # If a store is ever DELETED and recreated in dev, its id changes and
  # the matching find_value below must be updated. cicd/validate_repo.py
  # fails the PR when an item carries a dev id no rule here covers, so a
  # stale entry shows up as a red X instead of as wrong data.
  # ==================================================================

  # Dev workspace: dev_github_cicd
  - find_value: "20d6e797-9f3e-4e0a-a291-0789bdb1b623"
    replace_value:
      test: "$workspace.id"

  # Dev lakehouse: test_LH
  - find_value: "b55ebcb9-1444-450f-92eb-0dd5f28bbe6d"
    replace_value:
      test: "$items.Lakehouse.test_LH.id"

  # ------------------------------------------------------------------
  # Dev warehouse: insurance_WH
  #
  # sales_semantic_model is DirectLake-on-OneLake. Its connection is an
  # AzureStorage.DataLake URL in definition/expressions.tmdl, shaped
  #   https://onelake.dfs.fabric.microsoft.com/<workspace id>/<item id>
  # so the warehouse is addressed by ITEM ID, not by SQL endpoint. The
  # rule above rewrites the first segment, this one the second.
  #
  # There is no Sql.Database(...) string anywhere in this model, so a
  # rule matching on the .datawarehouse.fabric.microsoft.com hostname
  # matches nothing. Only add one back if the model is re-authored over
  # the SQL endpoint (import / DirectQuery from Power BI Desktop).
  # ------------------------------------------------------------------
  - find_value: "5e59288a-8c37-41e0-985f-9791bffd60c6"
    replace_value:
      test: "$items.Warehouse.insurance_WH.id"
