# .github/workflows/validate-pr.yml
#
# Pre-merge checks. Runs on every pull request targeting a deployment branch.
#
# Deliberately touches nothing outside the runner: no Fabric API calls, no
# secrets, no deployment. That keeps it fast, free, and safe to run on
# branches whose contents have not been reviewed yet — while still catching
# the failures that would otherwise only surface after a merge.
#
# Pair this with a branch ruleset on `test` that requires these checks to
# pass, so a pull request that fails cannot be merged at all.

name: Validate pull request

on:
  pull_request:
    branches:
      - test
      # Add "- prod" alongside the deploy workflow when that branch exists.
    paths:
      - 'fabric/**'
      - 'cicd/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  # One validation run per pull request. Superseded runs are cancelled —
  # unlike deployment, there is nothing half-applied to worry about here.
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # ====================================================================
  # Static checks — structure, parameterisation, T-SQL batching, syntax
  # ====================================================================
  static_checks:
    name: Static repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML and ruff
        run: pip install pyyaml ruff

      - name: Validate repository
        run: |
          # Target environment is the branch being merged into, so the same
          # workflow validates prod pull requests correctly once that branch
          # exists.
          python cicd/validate_repo.py --target-env "${{ github.base_ref }}"

      - name: Lint deployment scripts
        # Style and dead code that the ast.parse check in validate_repo.py
        # cannot see.
        run: ruff check --output-format=github cicd/

  # ====================================================================
  # Build the dacpac — proves the warehouse project actually compiles
  # ====================================================================
  build_dacpac:
    name: Build warehouse dacpac
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Pin .NET SDK to 8.x for sqlproj compatibility
        run: |
          # Newer SDKs are incompatible with the microsoft.build.sql version
          # Fabric's generated .sqlproj files target.
          echo '{"sdk":{"version":"8.0.0","rollForward":"latestMinor"}}' > global.json

      - name: Locate the warehouse project
        id: proj
        run: |
          PROJ=$(find fabric -name '*.sqlproj' | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "::error::No .sqlproj found under fabric/. The warehouse item may not have been committed from Fabric."
            exit 1
          fi
          echo "Found project: $PROJ"
          echo "path=$PROJ" >> "$GITHUB_OUTPUT"

      - name: Build dacpac
        run: |
          # Output directory deliberately has no leading dot: actions/upload-artifact
          # skips hidden paths when matching globs, so a ".dacpac/" directory would
          # build fine and then silently upload nothing.
          dotnet build "${{ steps.proj.outputs.path }}" \
            --configuration Release \
            --output dacpac-out

      - name: Confirm dacpac was produced
        run: |
          COUNT=$(find dacpac-out -name '*.dacpac' | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Build reported success but produced no .dacpac file."
            exit 1
          fi
          find dacpac-out -name '*.dacpac' -exec ls -lh {} \;

      # Keeping the artifact makes it possible to inspect exactly what would
      # have been deployed, without re-running the build.
      - name: Upload dacpac artifact
        uses: actions/upload-artifact@v4
        with:
          name: dacpac-pr-${{ github.event.pull_request.number }}
          path: dacpac-out/**/*.dacpac
          retention-days: 7
          if-no-files-found: error

  # ====================================================================
  # Single place to read the outcome from
  # ====================================================================
  summary:
    name: Validation summary
    needs: [static_checks, build_dacpac]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write summary
        run: |
          {
            echo "### Pull request validation"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Static repository checks + ruff lint | ${{ needs.static_checks.result }} |"
            echo "| Warehouse dacpac build | ${{ needs.build_dacpac.result }} |"
            echo ""
            echo "Merging into \`${{ github.base_ref }}\` triggers the deployment workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any check failed
        if: needs.static_checks.result != 'success' || needs.build_dacpac.result != 'success'
        run: exit 1
