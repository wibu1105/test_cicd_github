# ----------------------------------------------------------------
      # Lấy chìa khóa con Deploy SP từ Key Vault - Tên Vault gọi từ Secrets
      # ----------------------------------------------------------------
      - name: Fetch Deploy SP credentials from Key Vault
        id: fetch_secrets
        run: |
          DEPLOY_TENANT_ID=$(az keyvault secret show --name "deploy-sp-tenant-id" --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --query value -o tsv)
          DEPLOY_CLIENT_ID=$(az keyvault secret show --name "deploy-sp-client-id" --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --query value -o tsv)
          DEPLOY_CLIENT_SECRET=$(az keyvault secret show --name "deploy-sp-client-secret" --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --query value -o tsv)
          
          # Mask log để Github không in ra màn hình
          echo "::add-mask::$DEPLOY_TENANT_ID"
          echo "::add-mask::$DEPLOY_CLIENT_ID" 
          echo "::add-mask::$DEPLOY_CLIENT_SECRET"
          
          # Đẩy vào ENV để các step sau xài
          echo "DEPLOY_TENANT_ID=$DEPLOY_TENANT_ID" >> $GITHUB_ENV
          echo "DEPLOY_CLIENT_ID=$DEPLOY_CLIENT_ID" >> $GITHUB_ENV
          echo "DEPLOY_CLIENT_SECRET=$DEPLOY_CLIENT_SECRET" >> $GITHUB_ENV
