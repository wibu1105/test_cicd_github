# .github/workflows/deploy-to-fabric.yml

name: Deploy to Fabric

on:
  push:
    branches:
      - test
      # Add "- prod" here once a prod branch/workspace/environment exist.
  workflow_dispatch:
    inputs:
      items_in_scope:
        description: "Fabric item types to deploy (JSON array)"
        required: false
        default: '["Notebook","DataPipeline","Warehouse","SemanticModel","Report"]'
      unpublish_orphans:
        description: "Delete items in the workspace that are no longer in the repo"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # [BẮT BUỘC] Cho phép GitHub tạo OIDC token để nói chuyện với Azure

concurrency:
  group: deploy-fabric-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ====================================================================
  # Validate 
  # ====================================================================
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cicd/requirements.txt

      - name: Check expected folders exist
        run: |
          set -e
          for d in "fabric" "cicd" "fabric/insurance_WH.Warehouse"; do
            if [ ! -d "$d" ]; then
              echo "::error::Missing required directory: $d"
              exit 1
            fi
            echo "OK: $d"
          done

      - name: Check deployment scripts exist
        run: |
          set -e
          for f in cicd/deploy.py cicd/grant_and_get_endpoints.py cicd/parameter.yml cicd/requirements.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required script: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check Report connection type
        run: |
          python - <<'EOF'
          import sys, json, pathlib

          reports = list(pathlib.Path("fabric").glob("*.Report"))
          if not reports:
              print("::notice::No Report items found — skipping")
              sys.exit(0)

          failed = False
          for r in reports:
              pbir = r / "definition.pbir"
              if not pbir.exists():
                  print(f"::warning::{r.name}: definition.pbir not found, cannot verify")
                  continue
              try:
                  ref = json.loads(pbir.read_text()).get("datasetReference", {})
              except json.JSONDecodeError as e:
                  print(f"::error::{r.name}: definition.pbir is not valid JSON: {e}")
                  failed = True
                  continue
              if ref.get("byConnection"):
                  print(f"::error::{r.name} uses byConnection. Add to find_replace in parameter.yml.")
                  failed = True
              elif ref.get("byPath"):
                  print(f"OK: {r.name} uses byPath — resolved automatically")
              else:
                  print(f"::warning::{r.name}: unrecognised datasetReference shape")

          sys.exit(1 if failed else 0)
          EOF

      - name: Validate parameter.yml parses
        env:
          TARGET_ENV: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import sys, os, pathlib, yaml
          target_env = os.environ["TARGET_ENV"]
          p = pathlib.Path("cicd/parameter.yml")
          if not p.exists():
              print("::notice::cicd/parameter.yml not present — skipping")
              sys.exit(0)
          try:
              doc = yaml.safe_load(p.read_text()) or {}
          except yaml.YAMLError as e:
              print(f"::error::parameter.yml is not valid YAML: {e}")
              sys.exit(1)
          entries = doc.get("find_replace", [])
          for i, e in enumerate(entries, 1):
              fv = str(e.get("find_value", ""))
              if fv.startswith("<") and fv.endswith(">"):
                  print(f"::error::Entry {i} contains an unfilled placeholder: {fv}")
                  sys.exit(1)
              if target_env not in (e.get("replace_value") or {}):
                  print(f"::error::Entry {i} has no '{target_env}' key in replace_value")
                  sys.exit(1)
          print("parameter.yml checks passed")
          EOF

  # ====================================================================
  # Deploy 
  # ====================================================================
  deploy_to_test:
    name: Deploy to Fabric (${{ github.ref_name }})
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    timeout-minutes: 30

    env:
      TARGET_ENV: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cicd/requirements.txt

      - name: Install SqlPackage
        run: dotnet tool install --global microsoft.sqlpackage

      - name: Resolve repository directory
        id: gitdir
        run: |
          GITDIR="${{ vars.GIT_DIRECTORY }}"
          if [ -z "$GITDIR" ]; then
            GITDIR="fabric"
          fi
          echo "gitdir=$GITDIR" >> "$GITHUB_OUTPUT"

      - name: Stage parameter.yml into repository directory
        run: |
          GITDIR="${{ steps.gitdir.outputs.gitdir }}"
          if [ -f cicd/parameter.yml ]; then
            cp cicd/parameter.yml "$GITDIR/parameter.yml"
          fi

      # ----------------------------------------------------------------
      # Đăng nhập bằng OIDC (Reader SP) - Gọi từ tab Secrets
      # ----------------------------------------------------------------
      - name: Azure login via OIDC (Reader SP)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------------
      # Lấy toàn bộ chìa khóa của con Deploy SP từ Key Vault
      # ----------------------------------------------------------------
      - name: Fetch Deploy SP credentials from Key Vault
        id: fetch_secrets
        run: |
          DEPLOY_TENANT_ID=$(az keyvault secret show --name "deploy-sp-tenant-id" --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --query value -o tsv)
          DEPLOY_CLIENT_ID=$(az keyvault secret show --name "deploy-sp-client-id" --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --query value -o tsv)
          DEPLOY_CLIENT_SECRET=$(az keyvault secret show --name "deploy-sp-client-secret" --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --query value -o tsv)
          
          # Mask log để Github không in ra màn hình
          echo "::add-mask::$DEPLOY_TENANT_ID"
          echo "::add-mask::$DEPLOY_CLIENT_ID" 
          echo "::add-mask::$DEPLOY_CLIENT_SECRET"
          
          # Đẩy vào ENV để các step Python & SqlPackage xài
          echo "DEPLOY_TENANT_ID=$DEPLOY_TENANT_ID" >> $GITHUB_ENV
          echo "DEPLOY_CLIENT_ID=$DEPLOY_CLIENT_ID" >> $GITHUB_ENV
          echo "DEPLOY_CLIENT_SECRET=$DEPLOY_CLIENT_SECRET" >> $GITHUB_ENV

      # ----------------------------------------------------------------
      # Phase 1 — Deploy Fabric items (Sử dụng credentials vừa kéo ra)
      # ----------------------------------------------------------------
      - name: Phase 1 - Deploy Fabric items via fabric-cicd
        env:
          AZURE_TENANT_ID: ${{ env.DEPLOY_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ env.DEPLOY_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ env.DEPLOY_CLIENT_SECRET }}
        run: |
          python cicd/deploy.py \
            --target-env     "${{ env.TARGET_ENV }}" \
            --workspace-name "${{ vars[format('{0}_WORKSPACE_NAME', github.ref_name)] }}" \
            --git-directory  "${{ steps.gitdir.outputs.gitdir }}" \
            --items-in-scope "${{ github.event.inputs.items_in_scope || '[\"Notebook\",\"DataPipeline\",\"Warehouse\",\"SemanticModel\",\"Report\"]' }}" \
            --unpublish-orphans "${{ github.event.inputs.unpublish_orphans || 'true' }}"

      # ----------------------------------------------------------------
      # Phase 2 — Get endpoints
      # ----------------------------------------------------------------
      - name: Phase 2 - Get SQL endpoint
        env:
          AZURE_TENANT_ID: ${{ env.DEPLOY_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ env.DEPLOY_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ env.DEPLOY_CLIENT_SECRET }}
        run: |
          python cicd/grant_and_get_endpoints.py \
            --workspace-id    "${{ vars[format('{0}_WORKSPACE_ID', github.ref_name)] }}" \
            --warehouse-names "insurance_WH"

      - name: Verify endpoint was resolved
        run: |
          if [ -z "${{ env.INSURANCE_WH_ENDPOINT }}" ]; then
            echo "::error::INSURANCE_WH_ENDPOINT is empty."
            exit 1
          fi

      - name: Pin .NET SDK to 8.x for sqlproj compatibility
        run: echo '{"sdk":{"version":"8.0.0","rollForward":"latestMinor"}}' > global.json

      # ----------------------------------------------------------------
      # Phase 3 — Build and Publish Dacpac
      # ----------------------------------------------------------------
      - name: Phase 3a - Build insurance_WH dacpac
        run: |
          dotnet build fabric/insurance_WH.Warehouse/insurance_WH.sqlproj \
            --configuration Release \
            --output .dacpac/insurance_WH

      - name: Phase 3b - Publish schemas (Sử dụng credentials từ KeyVault)
        run: |
          sqlpackage /Action:Publish \
            /SourceFile:".dacpac/insurance_WH/insurance_WH.dacpac" \
            /TargetConnectionString:"Server=tcp:${{ env.INSURANCE_WH_ENDPOINT }},1433;Initial Catalog=insurance_WH;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;Authentication=Active Directory Service Principal;User Id=${{ env.DEPLOY_CLIENT_ID }};Password=${{ env.DEPLOY_CLIENT_SECRET }}" \
            /p:AllowIncompatiblePlatform=true \
            /p:DropObjectsNotInSource=false

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Fabric deployment (Zero Secrets Architecture) 🚀"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Workspace | \`${{ vars[format('{0}_WORKSPACE_NAME', github.ref_name)] }}\` |"
            echo "| Warehouse | \`insurance_WH\` (Bronze + Gold) |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "**Manual steps still required:**"
            echo "- Ensure Deploy SP is manually added to the Workspace Access."
            echo "- Load data into \`Bronze\`."
            echo "- Bind data source credentials on \`sales_semantic_model\`."
            echo "- Run \`pl_silver\` to populate Gold."
          } >> "$GITHUB_STEP_SUMMARY"
