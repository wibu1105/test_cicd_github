name: Deploy to Fabric

# Publishes every Fabric ITEM: Lakehouse, Warehouse, Notebook, DataPipeline,
# SemanticModel, Report — then runs the lakehouse schema notebook.
#
# deploy-warehouse.yml still owns the warehouse SCHEMA (dacpac / SqlPackage).
# Publishing the Warehouse here creates the item shell only; the tables and
# procedures inside it come from the dacpac, which needs .NET, SqlPackage and an
# ODBC driver that nothing in this file installs.
#
# WHY ONE JOB, ONE PUBLISH
# ------------------------
# The Lakehouse used to be published by a separate deploy-lakehouse.yml that had
# to run BEFORE this workflow, with no way to enforce that. Two orderings broke:
# the lakehouse had to exist before its id could be resolved, and
# nb_lakehouse_schema had to be published before the schema run could trigger it.
# Merging them turns a race into a sequence of steps.
#
# WHY WAREHOUSE AND LAKEHOUSE ARE IN --items-in-scope
# ---------------------------------------------------
# fabric-cicd resolves a $items.<Type>.<name>.$id variable only when <Type> is in
# scope for that run. Existing in the workspace is not enough — a run scoped to
# ["Notebook"] fails with "Attribute value not found for Lakehouse 'test_LH'"
# while test_LH is sitting right there. parameter.yml needs both ids, so both
# types are in scope. That is the whole reason; nothing here changes a store's
# contents. ($workspace.$id needs nothing in scope.)

on:
  push:
    branches: [test, prod]
    paths-ignore:
      # A warehouse-only change is a schema change — deploy-warehouse.yml's job.
      # This workflow still publishes the item shell whenever it runs for any
      # other reason, which is idempotent.
      - 'fabric/*.Warehouse/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Workspace to deploy to'
        required: true
        type: choice
        options:
          - test
          - prod
        default: test
      ref:
        description: 'Tag or commit SHA to deploy (blank = current branch head)'
        required: false
        type: string
        default: ''
      items_in_scope:
        description: 'JSON array of item types to publish'
        required: false
        default: '["Lakehouse","Warehouse","Notebook","DataPipeline","SemanticModel","Report"]'
      run_job:
        description: 'Item to run after deploy, as Name:Type (e.g. pl_ingest:DataPipeline)'
        required: false
        type: string
        default: ''
      unpublish_orphans:
        description: 'DANGER: deletes workspace items absent from the repo, stores included'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write

concurrency:
  # Keyed on the target workspace, not the branch: a dispatch of prod and a push
  # to test publish into different workspaces and must not queue behind each
  # other. Never cancelled — a half-applied publish is worse than a slow one.
  group: deploy-to-fabric-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:

  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_env: ${{ steps.target.outputs.env }}

    steps:
      # inputs.ref lets a dispatch redeploy an older tag. The workflow file
      # itself always comes from the branch the run was started on, so an old
      # tag is published by today's pipeline rather than the pipeline that
      # shipped with it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install pyyaml

      # A push carries no inputs at all, so the branch name is the environment.
      # A dispatch always has the dropdown, which is what makes deploying a tag
      # possible: github.ref_name would be "v1.2.0" there, which is neither a
      # workspace nor a parameter.yml key.
      - name: Resolve target environment
        id: target
        run: |
          TARGET="${{ inputs.environment }}"
          TARGET="${TARGET:-${{ github.ref_name }}}"
          case "$TARGET" in
            test|prod) ;;
            *)
              echo "::error::Unsupported environment '$TARGET'. Expected test or prod."
              echo "::error::Running from a tag? Use Run workflow and pick the environment."
              exit 1
              ;;
          esac
          echo "env=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target environment : $TARGET"
          echo "Deploying ref      : ${{ inputs.ref || github.ref }}"

      - name: Validate repository
        run: python cicd/validate_repo.py --target-env "${{ steps.target.outputs.env }}"

  deploy:
    name: Deploy to ${{ needs.validate.outputs.target_env }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.validate.outputs.target_env }}

    env:
      TARGET_ENV: ${{ needs.validate.outputs.target_env }}
      SCHEMA_NOTEBOOK: nb_lakehouse_schema
      RUN_JOB: ${{ inputs.run_job }}
      ITEMS_IN_SCOPE: >-
        ${{ inputs.items_in_scope
            || '["Lakehouse","Warehouse","Notebook","DataPipeline","SemanticModel","Report"]' }}
      UNPUBLISH_ORPHANS: ${{ inputs.unpublish_orphans || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deployment dependencies
        run: pip install -r cicd/requirements.txt

      # One place resolves everything that is keyed on the environment, so no
      # later step has to repeat the vars[format(...)] lookup and risk drifting
      # from this one.
      - name: Resolve workspace and git directory
        run: |
          GITDIR="${{ vars.GIT_DIRECTORY }}"
          GITDIR="${GITDIR:-fabric}"
          WS_ID="${{ vars[format('{0}_WORKSPACE_ID', needs.validate.outputs.target_env)] }}"
          WS_NAME="${{ vars[format('{0}_WORKSPACE_NAME', needs.validate.outputs.target_env)] }}"

          # An unset variable expands to empty, and every step below would then
          # quietly target nothing. Adding an environment is exactly when this is
          # easy to forget. The names are printed uppercase because that is how
          # they read in the GitHub UI, even though vars[] matching is not
          # case-sensitive and TARGET_ENV is the lowercase branch name.
          ENV_UC="$(echo "$TARGET_ENV" | tr 'a-z' 'A-Z')"
          [ -n "$WS_ID" ]   || { echo "::error::Variable ${ENV_UC}_WORKSPACE_ID is not set for environment '$TARGET_ENV'"; exit 1; }
          [ -n "$WS_NAME" ] || { echo "::error::Variable ${ENV_UC}_WORKSPACE_NAME is not set for environment '$TARGET_ENV'"; exit 1; }

          {
            echo "GITDIR=$GITDIR"
            echo "WORKSPACE_ID=$WS_ID"
            echo "WORKSPACE_NAME=$WS_NAME"
          } >> "$GITHUB_ENV"

          echo "Publishing from : $GITDIR"
          echo "Into workspace  : $WS_NAME ($WS_ID)"

      - name: Azure login (Reader SP via OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch Deploy SP credentials from Key Vault
        run: |
          KV="${{ secrets.AZURE_KEYVAULT_NAME }}"
          for pair in tenant-id:AZURE_TENANT_ID \
                      client-id:AZURE_CLIENT_ID \
                      client-secret:AZURE_CLIENT_SECRET; do
            secret="deploy-sp-${pair%%:*}"
            var="${pair##*:}"
            value="$(az keyvault secret show --vault-name "$KV" \
                       --name "$secret" --query value -o tsv)"
            [ -n "$value" ] || { echo "::error::Empty secret: $secret"; exit 1; }
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done

      - name: Stage parameter.yml
        run: |
          # fabric-cicd only reads parameter.yml from the root of the git
          # directory. cicd/parameter.yml stays the source of truth; this copy
          # lives on the runner only and is never committed.
          cp cicd/parameter.yml "$GITDIR/parameter.yml"
          echo "Staged to $GITDIR/parameter.yml"

      - name: Publish items
        run: |
          # Warehouse and Lakehouse are in scope so parameter.yml can read their
          # ids — which also puts them within reach of unpublish_orphans. It
          # defaults to false; turning it on deletes stores, and their data with
          # them, if the repo no longer carries the item folder.
          python cicd/deploy.py \
            --target-env "$TARGET_ENV" \
            --workspace-name "$WORKSPACE_NAME" \
            --git-directory "$GITDIR" \
            --items-in-scope "$ITEMS_IN_SCOPE" \
            --unpublish-orphans "$UNPUBLISH_ORPHANS"

      # The lakehouse equivalent of the warehouse dacpac publish. Runs after the
      # publish because the notebook it triggers is created by that step —
      # deliberately NOT --skip-if-missing, since a missing notebook now means
      # the publish dropped it, not that another workflow has yet to run.
      - name: Apply lakehouse schema
        run: |
          python cicd/trigger_job.py \
            --workspace-id "$WORKSPACE_ID" \
            --item-name "$SCHEMA_NOTEBOOK" \
            --item-type Notebook \
            --wait \
            --timeout-minutes 20

      - name: Run post-deploy job
        if: ${{ inputs.run_job != '' }}
        run: |
          python cicd/trigger_job.py \
            --workspace-id "$WORKSPACE_ID" \
            --item-name "${RUN_JOB%%:*}" \
            --item-type "${RUN_JOB##*:}" \
            --wait

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment to ${TARGET_ENV}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Workspace | ${WORKSPACE_NAME:-unresolved} |"
            echo "| Ref | \`${{ inputs.ref || github.ref }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Git directory | \`${GITDIR:-unresolved}\` |"
            echo "| Items in scope | \`${ITEMS_IN_SCOPE}\` |"
            echo "| Schema notebook | \`${SCHEMA_NOTEBOOK}\` |"
            echo "| Post-deploy job | \`${RUN_JOB:-none}\` |"
            echo ""
            echo "### Verify"
            echo ""
            echo "- Open \`sales_semantic_model\` lineage: its warehouse must sit in"
            echo "  **this** workspace, not the one it was authored in."
            echo "- Open \`nb_lakehouse_schema\` lineage: exactly **one** lakehouse."
            echo "  Two means the known_lakehouses rule stopped matching."
            echo "- A verbatim \`\$items.\` token in a deployed definition means the"
            echo "  item type left --items-in-scope - check ITEMS_IN_SCOPE above."
            echo ""
            echo "### Manual steps (deliberately not automated)"
            echo ""
            echo "- Bind data-source credentials on \`sales_semantic_model\`"
            echo "  (Fabric requires an interactive sign-in)."
            echo "- Load data into Bronze, then run \`pl_silver\` to populate Gold."
          } >> "$GITHUB_STEP_SUMMARY"
