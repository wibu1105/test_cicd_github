# Secret scanning. See GITLEAKS.md for the runbook.
#
# The only workflow here that is not dispatch-only: a scanner is worth nothing
# if it waits to be remembered.

name: Gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:
  # Only fires from the default branch. Rules improve, so a commit that looked
  # clean last month can match a rule added since.
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gitleaks-${{ github.ref }}
  # Not cancelled. A push run scans only that push's commits, so cancelling one
  # leaves its range unscanned until the nightly sweep.
  cancel-in-progress: false

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 is required. A shallow clone has no history, so a secret
      # committed and later removed — the case that matters — would be missed.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organizations only; unset here, so this resolves empty.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Named, not auto-detected: a rename then fails loudly instead of
          # silently falling back to defaults and dropping the Fabric rules.
          GITLEAKS_CONFIG: .gitleaks.toml
