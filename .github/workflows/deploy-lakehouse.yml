# .github/workflows/deploy-lakehouse.yml
# Chỉ chạy khi file trong *.Lakehouse/ thay đổi, và chỉ deploy item Lakehouse.
# Mọi item khác (Notebook, DataPipeline, SemanticModel, Report) do
# deploy-to-fabric.yml lo.

name: Deploy lakehouse

on:
  push:
    branches: [test]
    paths:
      - 'fabric/**/*.Lakehouse/**'
  workflow_dispatch:
    inputs:
      run_job:
        description: "Item to run after deploy, as Name:Type (e.g. pl_ingest:DataPipeline)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-lakehouse-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ github.ref_name }}
  RUN_JOB: ${{ inputs.run_job }}
  SCHEMA_NOTEBOOK: nb_lakehouse_schema

jobs:
  # Cùng vai trò với job validate của deploy-to-fabric.yml: chặn deploy nếu repo
  # sai cấu trúc. Không gọi Fabric, không dùng secret nên chạy nhanh và rẻ.
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Validate repository
        run: python cicd/validate_repo.py --target-env "$TARGET_ENV"

  deploy:
    name: Publish lakehouse items
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r cicd/requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch Deploy SP credentials
        run: |
          for name in tenant-id client-id client-secret; do
            value=$(az keyvault secret show --name "deploy-sp-$name" \
              --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --query value -o tsv)
            echo "::add-mask::$value"
            echo "AZURE_$(echo "$name" | tr 'a-z-' 'A-Z_')=$value" >> "$GITHUB_ENV"
          done

      # Chỉ item Lakehouse. Notebook/DataPipeline/SemanticModel/Report luôn do
      # deploy-to-fabric.yml deploy. Tắt unpublish orphan vì đây là deploy phạm
      # vi hẹp, không được phép xoá gì.
      - name: Deploy Lakehouse item
        run: |
          cp cicd/parameter.yml fabric/parameter.yml
          python cicd/deploy.py \
            --target-env "$TARGET_ENV" \
            --workspace-name "${{ vars[format('{0}_WORKSPACE_NAME', github.ref_name)] }}" \
            --git-directory fabric \
            --items-in-scope '["Lakehouse"]' \
            --unpublish-orphans false

      # Tương đương bước "Publish schema" của Warehouse: chạy lại notebook khai
      # báo schema mỗi lần pipeline này chạy. --skip-if-missing để không fail
      # khi notebook chưa được tạo/deploy (deploy-to-fabric.yml mới là chỗ
      # publish item Notebook này).
      - name: Apply lakehouse schema
        run: |
          python cicd/trigger_job.py \
            --workspace-id "${{ vars[format('{0}_WORKSPACE_ID', github.ref_name)] }}" \
            --item-name "$SCHEMA_NOTEBOOK" \
            --item-type Notebook \
            --wait \
            --timeout-minutes 20 \
            --skip-if-missing

      - name: Run post-deploy job
        if: ${{ inputs.run_job != '' }}
        run: |
          python cicd/trigger_job.py \
            --workspace-id "${{ vars[format('{0}_WORKSPACE_ID', github.ref_name)] }}" \
            --item-name "${RUN_JOB%%:*}" \
            --item-type "${RUN_JOB##*:}" \
            --wait

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Lakehouse deployment"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Schema notebook | \`${SCHEMA_NOTEBOOK}\` |"
            echo "| Post-deploy job | \`${RUN_JOB:-none}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
