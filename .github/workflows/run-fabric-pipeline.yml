name: Run Fabric Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Choose target workspace
        required: true
        type: choice
        options:
          - test
          - prod
        default: test
      pipeline_name:
        description: Pipeline display name (blank uses POST_DEPLOY_PIPELINE_NAME)
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: post-deploy-pipeline-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  run:
    name: Run post-deploy pipeline in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60

    env:
      TARGET_ENV: ${{ inputs.environment }}
      PIPELINE_OVERRIDE: ${{ inputs.pipeline_name }}

    steps:
      # Checks out the branch or tag selected in the GitHub Actions UI.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r cicd/requirements.txt

      - name: Resolve workspace and pipeline
        env:
          CONFIGURED_PIPELINE: ${{ vars.POST_DEPLOY_PIPELINE_NAME }}
          CONFIGURED_WORKSPACE_ID: ${{ vars[format('{0}_WORKSPACE_ID', inputs.environment)] }}
        run: |
          PIPELINE_NAME="${PIPELINE_OVERRIDE:-$CONFIGURED_PIPELINE}"
          ENV_UC="$(echo "$TARGET_ENV" | tr 'a-z' 'A-Z')"

          [ -n "$CONFIGURED_WORKSPACE_ID" ] || {
            echo "::error::Variable ${ENV_UC}_WORKSPACE_ID is not set for environment '$TARGET_ENV'"
            exit 1
          }
          [ -n "$PIPELINE_NAME" ] || {
            echo "::error::Set the environment variable POST_DEPLOY_PIPELINE_NAME or provide pipeline_name"
            exit 1
          }

          {
            echo "WORKSPACE_ID=$CONFIGURED_WORKSPACE_ID"
            echo "PIPELINE_NAME=$PIPELINE_NAME"
          } >> "$GITHUB_ENV"

          echo "Workspace : $CONFIGURED_WORKSPACE_ID"
          echo "Pipeline  : $PIPELINE_NAME"

      - name: Azure login (Reader SP via OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch Deploy SP credentials from Key Vault
        run: |
          KV="${{ secrets.AZURE_KEYVAULT_NAME }}"
          for pair in tenant-id:AZURE_TENANT_ID \
                      client-id:AZURE_CLIENT_ID \
                      client-secret:AZURE_CLIENT_SECRET; do
            secret="deploy-sp-${pair%%:*}"
            var="${pair##*:}"
            value="$(az keyvault secret show --vault-name "$KV" \
                       --name "$secret" --query value -o tsv)"
            [ -n "$value" ] || { echo "::error::Empty secret: $secret"; exit 1; }
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done

      - name: Run Fabric data pipeline and wait for completion
        run: |
          python cicd/trigger_job.py \
            --workspace-id "$WORKSPACE_ID" \
            --item-name "$PIPELINE_NAME" \
            --item-type DataPipeline \
            --wait \
            --timeout-minutes 45

      - name: Summary
        if: always()
        run: |
          {
            echo "## Post-deploy Fabric pipeline"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | ${TARGET_ENV} |"
            echo "| Pipeline | ${PIPELINE_NAME:-unresolved} |"
            echo "| Ref | `${{ github.ref }}` |"
            echo "| Commit | `${{ github.sha }}` |"
          } >> "$GITHUB_STEP_SUMMARY"
